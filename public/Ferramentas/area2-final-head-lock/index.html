<body>

<div id="stage">

<script>
"use strict";
/* ============================================================
   ÁREA 2 — FINAL HEAD LOCK
   Pipeline:
     máscara de silhueta -> perfil por linha L(y)/R(y)
     -> referência de consenso (mediana iterativa)
     -> solver global (dx,dy,sx,sy) custo Huber ponderado
     -> warp local suave só se compensar (score em pixels)
     -> avaliação em px -> OK / REVISAR
   ============================================================ */

const $ = id => document.getElementById(id);
const S = {
  items: [], W:0, H:0, fx:0, fy:0, fw:0, fh:0,   // work frame
  ref: null, refMask:null, cur:0, playing:false, timer:null,
  baselineJitter: null, processed:false
};

/* ---------- utilitários ---------- */
const yieldUI = () => new Promise(r => setTimeout(r, 0));
function setProg(p, txt){ $('progf').style.width = (p*100).toFixed(1)+'%'; if(txt!==undefined) $('log').textContent = txt; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function smoothstep(e0,e1,x){ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }

function gauss1d(arr, sigma){
  const n = arr.length; if(sigma<=0.3) return arr.slice();
  const r = Math.max(1, Math.ceil(sigma*3));
  const k = new Float64Array(2*r+1); let s=0;
  for(let i=-r;i<=r;i++){ const v=Math.exp(-(i*i)/(2*sigma*sigma)); k[i+r]=v; s+=v; }
  for(let i=0;i<k.length;i++) k[i]/=s;
  const out = new Float64Array(n);
  for(let i=0;i<n;i++){
    let acc=0;
    for(let j=-r;j<=r;j++){ const idx=clamp(i+j,0,n-1); acc += arr[idx]*k[j+r]; }
    out[i]=acc;
  }
  return out;
}
function medianOf(a){ if(!a.length) return NaN; const b=Array.from(a).sort((x,y)=>x-y); const m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; }

/* ---------- carregamento ---------- */
$('drop').onclick = () => $('fin').click();
$('btnFiles').onclick = () => $('fin2').click();
$('fin').onchange = e => loadFiles(e.target.files);
$('fin2').onchange = e => loadFiles(e.target.files);
$('drop').addEventListener('dragover', e=>{e.preventDefault();});
$('drop').addEventListener('drop', e=>{e.preventDefault(); loadFiles(e.dataTransfer.files);});

async function loadFiles(fileList){
  const files = Array.from(fileList).filter(f => /\.(png|webp|jpe?g)$/i.test(f.name) && f.size>0);
  files.sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}));
  if(!files.length){ $('log').textContent = 'Nenhuma imagem válida encontrada.'; return; }
  S.items = []; S.processed=false; S.ref=null; S.baselineJitter=null;
  S.ovlP=null; S.ovlO=null; S.refMaskCache=null; S.W=0; S.H=0;
  stopPlay();
  $('btnProc').disabled = true; $('btnFix').disabled=true; $('btnZip').disabled=true; $('btnDir').disabled=true;
  $('thumbs').innerHTML='';

  // passo A: decodifica cada imagem, acha bbox grosseira em baixa resolução
  const tmp = document.createElement('canvas'), tc = tmp.getContext('2d', {willReadFrequently:true});
  const boxes = [];
  for(let i=0;i<files.length;i++){
    setProg(i/files.length, `Lendo ${i+1}/${files.length} — ${files[i].name}`);
    if(i%6===0) await yieldUI();
    let bmp;
    try { bmp = await createImageBitmap(files[i]); } catch(e){ boxes.push(null); continue; }
    if(!S.W){ S.W = bmp.width; S.H = bmp.height; }
    const sc = Math.min(1, 256/Math.max(bmp.width,bmp.height));
    tmp.width = Math.max(2,Math.round(bmp.width*sc)); tmp.height = Math.max(2,Math.round(bmp.height*sc));
    tc.clearRect(0,0,tmp.width,tmp.height); tc.drawImage(bmp,0,0,tmp.width,tmp.height);
    const d = tc.getImageData(0,0,tmp.width,tmp.height);
    const bb = roughBox(d, tmp.width, tmp.height);
    bmp.close && bmp.close();
    if(!bb){ boxes.push(null); continue; }
    boxes.push({ x0: bb.x0/sc, y0: bb.y0/sc, x1: bb.x1/sc, y1: bb.y1/sc, whiteBG: bb.whiteBG });
    S.items.push({ name: files[i].name, file: files[i], box: boxes[boxes.length-1] });
  }
  S.items = S.items.filter(it => it.box);
  if(S.items.length < 2){ setProg(0,'Precisa de pelo menos 2 imagens válidas.'); return; }

  // work frame = união + margem
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const it of S.items){ x0=Math.min(x0,it.box.x0); y0=Math.min(y0,it.box.y0); x1=Math.max(x1,it.box.x1); y1=Math.max(y1,it.box.y1); }
  const mw = (x1-x0)*0.22 + 12, mh = (y1-y0)*0.18 + 12;
  S.fx = Math.max(0, Math.floor(x0-mw)); S.fy = Math.max(0, Math.floor(y0-mh));
  S.fw = Math.min(S.W-S.fx, Math.ceil(x1+mw)-S.fx); S.fh = Math.min(S.H-S.fy, Math.ceil(y1+mh)-S.fy);

  // passo B: recorta em resolução total + máscara + perfil
  const cc = document.createElement('canvas'); cc.width=S.fw; cc.height=S.fh;
  const cx2 = cc.getContext('2d',{willReadFrequently:true});
  for(let i=0;i<S.items.length;i++){
    const it = S.items[i];
    setProg(i/S.items.length, `Analisando ${i+1}/${S.items.length} — ${it.name}`);
    if(i%4===0) await yieldUI();
    const bmp = await createImageBitmap(it.file);
    cx2.clearRect(0,0,S.fw,S.fh);
    cx2.drawImage(bmp, S.fx, S.fy, S.fw, S.fh, 0, 0, S.fw, S.fh);
    bmp.close && bmp.close();
    it.crop = cx2.getImageData(0,0,S.fw,S.fh);
    it.mask = buildMask(it.crop, S.fw, S.fh, it.box.whiteBG);
    it.prof = rowProfile(it.mask, S.fw, S.fh);
    it.P = {dx:0,dy:0,sx:1,sy:1}; it.field=null; it.status='—'; it.score=null;
  }
  S.items = S.items.filter(it => it.prof && it.prof.top >= 0 && (it.prof.bot - it.prof.top) > 12);
  setProg(1, `${S.items.length} cabeças prontas. Frame ${S.fw}×${S.fh}px.`);
  $('kN').textContent = S.items.length;
  $('btnProc').disabled = false;
  S.cur = 0; buildThumbs(); draw();
}

function roughBox(d, w, h){
  const p = d.data;
  // detecta fundo branco opaco
  const corners = [0, (w-1)*4, (h-1)*w*4, ((h-1)*w + w-1)*4];
  let opaque=0, bright=0;
  for(const c of corners){ if(p[c+3]>250){opaque++; if(p[c]>244&&p[c+1]>244&&p[c+2]>244) bright++; } }
  const whiteBG = (opaque===4 && bright===4);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=(y*w+x)*4; let on;
    if(whiteBG) on = p[i+3]>128 && !(p[i]>242&&p[i+1]>242&&p[i+2]>242);
    else on = p[i+3]>40;
    if(on){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if(x1<0) return null;
  return {x0,y0,x1:x1+1,y1:y1+1,whiteBG};
}

/* ---------- máscara de silhueta ---------- */
function buildMask(imgData, w, h, whiteBG){
  const p = imgData.data, m = new Uint8Array(w*h);
  for(let i=0,j=0;i<m.length;i++,j+=4){
    if(whiteBG) m[i] = (p[j+3]>140 && !(p[j]>240&&p[j+1]>240&&p[j+2]>240)) ? 1:0;
    else m[i] = p[j+3] >= 96 ? 1:0;
  }
  const r = Math.max(2, Math.round(Math.min(w,h)*0.008));
  openVertical(m, w, h, r);   // remove cílios / traços finos horizontais
  largestCC(m, w, h);         // remove corações, gotas, respingos soltos
  fillHoles(m, w, h);
  return m;
}
function openVertical(m,w,h,r){
  const tmp = new Uint8Array(w*h);
  for(let x=0;x<w;x++){                       // erosão vertical
    for(let y=0;y<h;y++){
      let v=1;
      for(let k=-r;k<=r;k++){ const yy=y+k; if(yy<0||yy>=h||!m[yy*w+x]){ v=0; break; } }
      tmp[y*w+x]=v;
    }
  }
  for(let x=0;x<w;x++){                       // dilatação vertical
    for(let y=0;y<h;y++){
      let v=0;
      for(let k=-r;k<=r;k++){ const yy=y+k; if(yy>=0&&yy<h&&tmp[yy*w+x]){ v=1; break; } }
      m[y*w+x]=v;
    }
  }
}
function largestCC(m,w,h){
  const lab = new Int32Array(w*h).fill(-1);
  const stack = new Int32Array(w*h);
  let best=-1, bestN=0;
  for(let s=0;s<m.length;s++){
    if(!m[s]||lab[s]>=0) continue;
    let sp=0; stack[sp++]=s; lab[s]=s; let n=0;
    while(sp){
      const i=stack[--sp]; n++;
      const x=i%w, y=(i/w)|0;
      if(x>0   && m[i-1] && lab[i-1]<0){ lab[i-1]=s; stack[sp++]=i-1; }
      if(x<w-1 && m[i+1] && lab[i+1]<0){ lab[i+1]=s; stack[sp++]=i+1; }
      if(y>0   && m[i-w] && lab[i-w]<0){ lab[i-w]=s; stack[sp++]=i-w; }
      if(y<h-1 && m[i+w] && lab[i+w]<0){ lab[i+w]=s; stack[sp++]=i+w; }
    }
    if(n>bestN){ bestN=n; best=s; }
  }
  if(best<0) return;
  for(let i=0;i<m.length;i++) if(m[i] && lab[i]!==best) m[i]=0;
}
function fillHoles(m,w,h){
  const vis = new Uint8Array(w*h); const st=new Int32Array(w*h); let sp=0;
  for(let x=0;x<w;x++){ if(!m[x]&&!vis[x]){vis[x]=1;st[sp++]=x;} const b=(h-1)*w+x; if(!m[b]&&!vis[b]){vis[b]=1;st[sp++]=b;} }
  for(let y=0;y<h;y++){ const a=y*w, b=y*w+w-1; if(!m[a]&&!vis[a]){vis[a]=1;st[sp++]=a;} if(!m[b]&&!vis[b]){vis[b]=1;st[sp++]=b;} }
  while(sp){ const i=st[--sp]; const x=i%w,y=(i/w)|0;
    if(x>0&&!m[i-1]&&!vis[i-1]){vis[i-1]=1;st[sp++]=i-1;}
    if(x<w-1&&!m[i+1]&&!vis[i+1]){vis[i+1]=1;st[sp++]=i+1;}
    if(y>0&&!m[i-w]&&!vis[i-w]){vis[i-w]=1;st[sp++]=i-w;}
    if(y<h-1&&!m[i+w]&&!vis[i+w]){vis[i+w]=1;st[sp++]=i+w;}
  }
  for(let i=0;i<m.length;i++) if(!m[i]&&!vis[i]) m[i]=1;
}

/* ---------- perfil por linha ---------- */
function rowProfile(m,w,h){
  const L=new Float64Array(h).fill(NaN), R=new Float64Array(h).fill(NaN), N=new Float64Array(h);
  let top=-1,bot=-1, maxW=0, maxWy=0;
  for(let y=0;y<h;y++){
    let l=-1,r=-1,n=0;
    for(let x=0;x<w;x++){ if(m[y*w+x]){ if(l<0)l=x; r=x; n++; } }
    if(l>=0){ L[y]=l; R[y]=r+1; N[y]=n; if(top<0)top=y; bot=y;
      const ww=r+1-l; if(ww>maxW){maxW=ww;maxWy=y;} }
  }
  if(top<0) return null;
  return {L,R,N,top,bot:bot+1,maxW,maxWy,h};
}
function sampleProf(prof, y){
  const {L,R,top,bot} = prof;
  if(y < top || y > bot-1) return null;
  const y0 = Math.floor(y), y1 = Math.min(bot-1, y0+1), t = y-y0;
  if(isNaN(L[y0])||isNaN(L[y1])) return null;
  return { L: L[y0]*(1-t)+L[y1]*t, R: R[y0]*(1-t)+R[y1]*t };
}

/* ---------- pesos de prioridade (do meio pra baixo) ---------- */
function makeWeights(refTop, refBot){
  const n = S.fh, w = new Float64Array(n), H = refBot-refTop;
  for(let y=0;y<n;y++){
    const t = (y-refTop)/H;
    if(t<0||t>1.02){ w[y]=0; continue; }
    let v;
    if(t < 0.40) v = 0.12;
    else if(t < 0.56) v = 0.12 + 0.88*smoothstep(0.40,0.56,t);
    else v = 1.0;
    if(t > 0.965) v *= 0.55;            // base cortada varia, não é confiável
    w[y]=v;
  }
  return w;
}

/* ---------- custo + solver ---------- */
const HUB = 2.0;
function huber(r){ const a=Math.abs(r); return a<=HUB ? r*r : HUB*(2*a-HUB); }

function cost(prof, P, ref, W){
  const cx = S.fw/2, cy = S.fh/2;
  let acc=0, wsum=0;
  for(let Y=ref.top; Y<ref.bot; Y++){
    const wy = W[Y]; if(wy<=0) continue;
    const Lr = ref.L[Y], Rr = ref.R[Y]; if(isNaN(Lr)) continue;
    const y = cy + (Y - cy - P.dy)/P.sy;
    const s = sampleProf(prof, y); if(!s) continue;
    const Lp = cx + P.sx*(s.L-cx) + P.dx;
    const Rp = cx + P.sx*(s.R-cx) + P.dx;
    acc += wy*(huber(Lp-Lr) + huber(Rp-Rr)); wsum += wy*2;
  }
  if(wsum < 1) return 1e9;
  let c = acc/wsum;
  c += 500*(P.sx-P.sy)*(P.sx-P.sy);                       // prefere isotropia
  c += 60*((P.sx-1)*(P.sx-1) + (P.sy-1)*(P.sy-1));        // prefere não mexer
  return c;
}

function solve(prof, ref, W, P0, steps0){
  let P = {...P0};
  let step = steps0 ? {...steps0} : {dx:5, dy:5, sx:.05, sy:.05};
  const min = {dx:.02, dy:.02, sx:.0003, sy:.0003};
  let c = cost(prof,P,ref,W), guard=0;
  while(guard++ < 900){
    let improved=false;
    for(const k of ['dx','dy','sx','sy']){
      for(const s of [+1,-1]){
        const Q = {...P}; Q[k] = P[k] + s*step[k];
        if((k==='sx'||k==='sy') && (Q[k]<0.80 || Q[k]>1.25)) continue;
        const cq = cost(prof,Q,ref,W);
        if(cq < c-1e-9){ P=Q; c=cq; improved=true; }
      }
    }
    if(!improved){
      let done=true;
      for(const k of ['dx','dy','sx','sy']){ step[k]*=0.5; if(step[k]>min[k]) done=false; }
      if(done) break;
    }
  }
  return {P, c};
}

/* ---------- perfil alinhado ---------- */
function alignedProfile(prof, P){
  const cx=S.fw/2, cy=S.fh/2, n=S.fh;
  const L=new Float64Array(n).fill(NaN), R=new Float64Array(n).fill(NaN);
  let top=-1,bot=-1;
  for(let Y=0;Y<n;Y++){
    const y = cy + (Y - cy - P.dy)/P.sy;
    const s = sampleProf(prof,y); if(!s) continue;
    L[Y] = cx + P.sx*(s.L-cx) + P.dx;
    R[Y] = cx + P.sx*(s.R-cx) + P.dx;
    if(top<0) top=Y; bot=Y;
  }
  if(top<0) return null;
  return {L,R,top,bot:bot+1};
}

/* ---------- referência de consenso ---------- */
function consensus(profs){
  const n=S.fh;
  const L=new Float64Array(n).fill(NaN), R=new Float64Array(n).fill(NaN);
  let top=-1,bot=-1;
  for(let y=0;y<n;y++){
    const ls=[], rs=[];
    for(const p of profs){ if(p && !isNaN(p.L[y])){ ls.push(p.L[y]); rs.push(p.R[y]); } }
    if(ls.length >= profs.length*0.5){
      L[y]=medianOf(ls); R[y]=medianOf(rs);
      if(top<0) top=y; bot=y;
    }
  }
  if(top<0) return null;
  // preenche NaN internos pelo vizinho válido antes de suavizar
  for(const A of [L,R]){
    let last=NaN;
    for(let y=top;y<=bot;y++){ if(!isNaN(A[y])) last=A[y]; else if(!isNaN(last)) A[y]=last; }
    last=NaN;
    for(let y=bot;y>=top;y--){ if(!isNaN(A[y])) last=A[y]; else if(!isNaN(last)) A[y]=last; }
  }
  // suaviza levemente (mediana por linha pode gerar degrau de 1px)
  const Ls=gauss1d(L.slice(top,bot+1),1.2), Rs=gauss1d(R.slice(top,bot+1),1.2);
  for(let i=0;i<Ls.length;i++){ L[top+i]=Ls[i]; R[top+i]=Rs[i]; }
  return {L,R,top,bot:bot+1};
}

/* ---------- inicialização por âncora (linha mais larga) ---------- */
function bootstrapInit(prof, anchor){
  const cx=S.fw/2, cy=S.fh/2;
  const s = prof.maxW>0 ? anchor.maxW/prof.maxW : 1;
  const c0 = (prof.L[prof.maxWy]+prof.R[prof.maxWy])/2;
  const cRef = anchor.cx;
  return {
    sx: s, sy: s,
    dx: cRef - (cx + s*(c0-cx)),
    dy: anchor.maxWy - (cy + s*(prof.maxWy-cy))
  };
}

/* ---------- campo de warp local ---------- */
function buildField(ap, ref, W, limits){
  const n=S.fh;
  const lo=Math.max(ap.top, ref.top), hi=Math.min(ap.bot, ref.bot);
  if(hi-lo < 10) return null;
  const H = ref.bot-ref.top;
  const ecR=new Float64Array(n), kR=new Float64Array(n).fill(1), Ca=new Float64Array(n).fill(NaN);
  for(let y=lo;y<hi;y++){
    if(isNaN(ap.L[y])||isNaN(ref.L[y])) continue;
    const ca=(ap.L[y]+ap.R[y])/2, cr=(ref.L[y]+ref.R[y])/2;
    const wa=ap.R[y]-ap.L[y], wr=ref.R[y]-ref.L[y];
    Ca[y]=ca; ecR[y]=cr-ca; kR[y]= wa>3 ? wr/wa : 1;
  }
  // preenche buracos por vizinho válido
  let last=NaN;
  for(let y=0;y<n;y++){ if(!isNaN(Ca[y])) last=Ca[y]; else if(!isNaN(last)) Ca[y]=last; }
  last=NaN; for(let y=n-1;y>=0;y--){ if(!isNaN(Ca[y])) last=Ca[y]; else if(!isNaN(last)) Ca[y]=last; }
  for(let y=0;y<n;y++) if(isNaN(Ca[y])) Ca[y]=S.fw/2;

  let ec = gauss1d(ecR, 14), k = gauss1d(kR, 14);

  // campo vertical: casa alturas onde a largura cruza frações do máximo
  const ey = new Float64Array(n);
  if(limits.ey){
    const ctrl=[];
    const maxWr = maxWidth(ref), maxWa = maxWidth(ap);
    for(const f of [0.95,0.85,0.72,0.58,0.45]){
      const yr = crossRow(ref, maxWr*f), ya = crossRow(ap, maxWa*f);
      if(yr!=null && ya!=null) ctrl.push([yr, clamp(yr-ya,-limits.ey,limits.ey)]);
    }
    if(ctrl.length>=2){
      ctrl.sort((a,b)=>a[0]-b[0]);
      for(let y=0;y<n;y++){
        let v;
        if(y<=ctrl[0][0]) v=ctrl[0][1];
        else if(y>=ctrl[ctrl.length-1][0]) v=ctrl[ctrl.length-1][1];
        else { let i=0; while(i<ctrl.length-1 && ctrl[i+1][0]<y) i++;
               const t=(y-ctrl[i][0])/(ctrl[i+1][0]-ctrl[i][0]); v=ctrl[i][1]*(1-t)+ctrl[i+1][1]*t; }
        ey[y]=v;
      }
    }
  }
  const eyS = gauss1d(ey, 18);

  // rampa de prioridade: zero em cima, 1 do meio pra baixo
  const out = { ec:new Float64Array(n), k:new Float64Array(n).fill(1), ey:new Float64Array(n), Ca,
                maxK:0, maxEc:0, maxEy:0 };
  for(let y=0;y<n;y++){
    const t=(y-ref.top)/H;
    const ramp = t<0.42 ? 0 : smoothstep(0.42,0.60,t);
    let e = clamp(ec[y]*ramp, -limits.ec, limits.ec);
    let kk = 1 + clamp((k[y]-1)*ramp, -limits.k, limits.k);
    let v = clamp(eyS[y]*ramp, -limits.ey, limits.ey);
    out.ec[y]=e; out.k[y]=kk; out.ey[y]=v;
  }
  // re-suaviza após clamp (elimina qualquer quina)
  const e2=gauss1d(out.ec,7), k2=gauss1d(out.k,7), y2=gauss1d(out.ey,9);
  for(let y=0;y<n;y++){
    out.ec[y]=e2[y]; out.k[y]=k2[y]; out.ey[y]=y2[y];
    out.maxEc=Math.max(out.maxEc,Math.abs(e2[y]));
    out.maxK =Math.max(out.maxK, Math.abs(k2[y]-1));
    out.maxEy=Math.max(out.maxEy,Math.abs(y2[y]));
  }
  return out;
}
function maxWidth(p){ let m=0; for(let y=p.top;y<p.bot;y++){ if(!isNaN(p.L[y])) m=Math.max(m,p.R[y]-p.L[y]); } return m; }
function crossRow(p, target){   // primeira linha ABAIXO do máximo onde a largura cai de target
  let my=-1,mw=0;
  for(let y=p.top;y<p.bot;y++){ if(isNaN(p.L[y]))continue; const w=p.R[y]-p.L[y]; if(w>mw){mw=w;my=y;} }
  if(my<0) return null;
  for(let y=my;y<p.bot;y++){
    if(isNaN(p.L[y])) continue;
    const w=p.R[y]-p.L[y];
    if(w<=target){
      const wp = (y>my && !isNaN(p.L[y-1])) ? p.R[y-1]-p.L[y-1] : w;
      const t = (wp-w)>1e-6 ? (wp-target)/(wp-w) : 0;
      return y-1+t;
    }
  }
  return null;
}
function warpProfile(ap, F){
  const n=S.fh;
  const L=new Float64Array(n).fill(NaN), R=new Float64Array(n).fill(NaN);
  let top=-1,bot=-1;
  for(let y=ap.top;y<ap.bot;y++){
    if(isNaN(ap.L[y])) continue;
    const Y = Math.round(y + F.ey[y]);
    if(Y<0||Y>=n) continue;
    const ca=F.Ca[y], k=F.k[y], e=F.ec[y];
    L[Y]=ca+e+(ap.L[y]-ca)*k; R[Y]=ca+e+(ap.R[y]-ca)*k;
    if(top<0)top=Y; bot=Y;
  }
  for(let y=top+1;y<bot;y++) if(isNaN(L[y])){ L[y]=(L[y-1]+L[y+1])/2; R[y]=(R[y-1]+R[y+1])/2; }
  if(top<0) return ap;
  return {L,R,top,bot:bot+1};
}

/* ---------- avaliação em pixels ---------- */
function evaluate(p, ref, W){
  let s=0, wsum=0, mx=0, mxLow=0;
  const H=ref.bot-ref.top;
  for(let Y=ref.top;Y<ref.bot;Y++){
    const wy=W[Y]; if(wy<=0) continue;
    if(isNaN(p.L[Y])||isNaN(ref.L[Y])) continue;
    const a=Math.abs(p.L[Y]-ref.L[Y]), b=Math.abs(p.R[Y]-ref.R[Y]);
    s += wy*(a*a+b*b); wsum += wy*2;
    const t=(Y-ref.top)/H;
    if(t>0.52 && t<0.96){ mxLow=Math.max(mxLow,a,b); }
    mx=Math.max(mx,a,b);
  }
  const rms = wsum>0 ? Math.sqrt(s/wsum) : 99;
  return { rms, max: mxLow || mx };
}
function distortionPenalty(F){
  if(!F) return 0;
  return F.maxK*100*0.35 + F.maxEc*0.10 + F.maxEy*0.10;
}
const OK_RMS = 0.70, OK_MAX = 1.80;
function isOK(ev, F){
  return ev.rms <= OK_RMS && ev.max <= OK_MAX && (!F || (F.maxK<=0.045 && F.maxEc<=6 && F.maxEy<=6));
}

/* ============================================================
   PROCESSAR 1
   ============================================================ */
$('btnProc').onclick = processAll;

async function processAll(){
  if(!S.items.length) return;
  stopPlay();
  $('btnProc').disabled=true; $('btnFix').disabled=true;

  // tremor original (baseline) — só pra comparar no final
  if(S.baselineJitter===null){
    const p0 = consensus(S.items.map(i=>i.prof));
    const W0 = makeWeights(p0.top, p0.bot);
    let acc=0; for(const it of S.items) acc += evaluate(it.prof, p0, W0).rms;
    S.baselineJitter = acc/S.items.length;
    $('kB').textContent = S.baselineJitter.toFixed(2)+' px';
  }

  // ---- iteração 0: âncora pela linha mais larga mediana
  const mws = S.items.map(i=>i.prof.maxW);
  const anchor = { maxW: medianOf(mws), maxWy: Math.round(medianOf(S.items.map(i=>i.prof.maxWy))),
                   cx: medianOf(S.items.map(i=>(i.prof.L[i.prof.maxWy]+i.prof.R[i.prof.maxWy])/2)) };
  for(const it of S.items) it.P = bootstrapInit(it.prof, anchor);

  let ref = consensus(S.items.map(it => alignedProfile(it.prof, it.P)));
  let W = makeWeights(ref.top, ref.bot);

  // ---- refinamento groupwise (3 passadas)
  for(let iter=0; iter<3; iter++){
    for(let i=0;i<S.items.length;i++){
      const it=S.items[i];
      setProg((iter*S.items.length+i)/(3*S.items.length), `Registro ${iter+1}/3 — ${i+1}/${S.items.length}`);
      if(i%8===0) await yieldUI();
      it.P = solve(it.prof, ref, W, it.P, iter===0?{dx:5,dy:5,sx:.05,sy:.05}:{dx:1.2,dy:1.2,sx:.012,sy:.012}).P;
    }
    ref = consensus(S.items.map(it => alignedProfile(it.prof, it.P)));
    W = makeWeights(ref.top, ref.bot);
  }

  // ---- re-ancora: transformação MEDIANA vira identidade (preserva a cabeça típica)
  const msx=medianOf(S.items.map(i=>i.P.sx)), msy=medianOf(S.items.map(i=>i.P.sy));
  const mdx=medianOf(S.items.map(i=>i.P.dx)), mdy=medianOf(S.items.map(i=>i.P.dy));
  const cx=S.fw/2, cy=S.fh/2, n=S.fh;
  const L2=new Float64Array(n).fill(NaN), R2=new Float64Array(n).fill(NaN);
  let t2=-1,b2=-1;
  // inverso da transformação mediana aplicado à referência
  for(let Y=0;Y<n;Y++){
    const yr = cy + (Y - cy)*msy + mdy;         // linha da ref correspondente
    const sp = sampleProf(ref, yr);
    if(!sp) continue;
    L2[Y] = cx + (sp.L - cx - mdx)/msx;
    R2[Y] = cx + (sp.R - cx - mdx)/msx;
    if(t2<0) t2=Y; b2=Y;
  }
  if(t2>=0){
    ref = {L:L2,R:R2,top:t2,bot:b2+1};
    W = makeWeights(ref.top, ref.bot);
    for(const it of S.items){
      it.P = { sx: it.P.sx/msx, sy: it.P.sy/msy,
               dx: (it.P.dx - mdx)/msx, dy: (it.P.dy - mdy)/msy };
    }
    for(let i=0;i<S.items.length;i++){
      const it=S.items[i];
      if(i%10===0){ setProg(i/S.items.length,`Ajuste fino ${i+1}/${S.items.length}`); await yieldUI(); }
      it.P = solve(it.prof, ref, W, it.P, {dx:.8,dy:.8,sx:.008,sy:.008}).P;
    }
  }
  S.ref = ref; S.W_ = W; S.refMaskCache = null;

  // ---- decide warp por imagem (só se compensar)
  for(let i=0;i<S.items.length;i++){
    const it=S.items[i];
    setProg(i/S.items.length, `Avaliando ${i+1}/${S.items.length}`);
    if(i%8===0) await yieldUI();
    pickBest(it, ref, W, [ {ec:0,k:0,ey:0}, {ec:3,k:0.020,ey:3} ]);
  }

  // ---- render final
  await renderAll();

  S.processed=true;
  $('btnProc').disabled=false; $('btnFix').disabled=false;
  $('btnZip').disabled=false; $('btnDir').disabled = !window.showDirectoryPicker;
  updateStats(); buildThumbs(); draw();
}

function pickBest(it, ref, W, levels){
  const ap = alignedProfile(it.prof, it.P);
  let best=null;
  for(const lim of levels){
    let F=null, prof=ap;
    if(lim.k>0 || lim.ec>0){
      F = buildField(ap, ref, W, lim);
      if(F) prof = warpProfile(ap, F);
    }
    const ev = evaluate(prof, ref, W);
    const sc = ev.rms + distortionPenalty(F);
    if(!best || sc < best.sc) best = {sc, ev, F, prof};
  }
  it.field = best.F; it.ev = best.ev; it.score = best.sc;
  it.status = isOK(best.ev, best.F) ? 'OK' : 'REVISAR';
  return best;
}

/* ============================================================
   CORRIGIR REVISAR — vários candidatos por imagem
   ============================================================ */
$('btnFix').onclick = fixFlagged;

async function fixFlagged(){
  if(!S.ref) return;
  stopPlay();
  const bad = S.items.filter(it => it.status !== 'OK');
  if(!bad.length){ setProg(1,'Nenhuma imagem marcada como REVISAR.'); return; }
  $('btnProc').disabled=true; $('btnFix').disabled=true;

  const ref=S.ref, W=S.W_;
  const Wlow = W.slice();                                  // pesos só na zona crítica
  const H = ref.bot-ref.top;
  for(let y=0;y<Wlow.length;y++){ const t=(y-ref.top)/H; if(t<0.50) Wlow[y]=0; }

  for(let i=0;i<bad.length;i++){
    const it=bad[i];
    setProg(i/bad.length, `Revisando ${i+1}/${bad.length} — ${it.name}`);
    await yieldUI();

    const cands=[];
    const push=(P,lim)=>{
      const ap=alignedProfile(it.prof,P); if(!ap) return;
      let F=null, prof=ap;
      if(lim.k>0||lim.ec>0){ F=buildField(ap,ref,W,lim); if(F) prof=warpProfile(ap,F); }
      const ev=evaluate(prof,ref,W);
      cands.push({P,F,ev,sc:ev.rms+distortionPenalty(F)});
    };

    // candidato A — re-solve global com busca larga (escapa de mínimo local)
    const A = solve(it.prof, ref, W, it.P, {dx:6,dy:6,sx:.06,sy:.06}).P;
    push(A,{ec:0,k:0,ey:0});
    // candidato B — global otimizado SÓ pela zona crítica
    const B = solve(it.prof, ref, Wlow, it.P, {dx:4,dy:4,sx:.04,sy:.04}).P;
    push(B,{ec:0,k:0,ey:0});
    // candidatos C/D/E — warp progressivo sobre a melhor base global
    for(const P of [A,B]){
      push(P,{ec:3,k:0.020,ey:3});
      push(P,{ec:5,k:0.035,ey:5});
      push(P,{ec:7,k:0.050,ey:6});
    }
    // candidato F — mantém o atual
    push(it.P, it.field ? {ec:5,k:0.035,ey:5} : {ec:0,k:0,ey:0});

    cands.sort((a,b)=>a.sc-b.sc);
    const w = cands[0];
    it.P=w.P; it.field=w.F; it.ev=w.ev; it.score=w.sc;
    it.status = isOK(w.ev, w.F) ? 'OK' : 'REVISAR';
  }

  await renderAll();
  S.refMaskCache = null;
  $('btnProc').disabled=false; $('btnFix').disabled=false;
  updateStats(); buildThumbs(); draw();
}

/* ============================================================
   RENDER FINAL (amostragem bilinear com alpha pré-multiplicado)
   ============================================================ */
async function renderAll(){
  S.ovlP=null; S.ovlO=null; S.refMaskCache=null;
  for(let i=0;i<S.items.length;i++){
    const it=S.items[i];
    if(i%4===0){ setProg(i/S.items.length, `Renderizando ${i+1}/${S.items.length}`); await yieldUI(); }
    it.proc = renderItem(it);
    it.pmask = buildMaskFromAlpha(it.proc, S.fw, S.fh);
    it.cProf = null;
  }
  setProg(1,'Pronto.');
}

function renderItem(it){
  const w=S.fw, h=S.fh, cx=w/2, cy=h/2, P=it.P, F=it.field;
  const src = it.crop.data;
  const out = new ImageData(w,h);
  const o = out.data;

  // tabela inversa do campo vertical: Y -> ya
  let invY=null;
  if(F){
    const fwd=new Float64Array(h);
    for(let y=0;y<h;y++) fwd[y]=y+F.ey[y];
    invY=new Float64Array(h);
    let j=0;
    for(let Y=0;Y<h;Y++){
      while(j<h-2 && fwd[j+1] < Y) j++;
      const a=fwd[j], b=fwd[j+1];
      invY[Y] = (b-a)>1e-6 ? j + (Y-a)/(b-a) : j;
      invY[Y] = clamp(invY[Y],0,h-1);
    }
  }

  for(let Y=0;Y<h;Y++){
    const ya = F ? invY[Y] : Y;
    let ca=0,k=1,e=0;
    if(F){
      const i0=clamp(Math.floor(ya),0,h-1), i1=clamp(i0+1,0,h-1), t=ya-i0;
      ca=F.Ca[i0]*(1-t)+F.Ca[i1]*t; k=F.k[i0]*(1-t)+F.k[i1]*t; e=F.ec[i0]*(1-t)+F.ec[i1]*t;
      if(!(k>0.5)) k=1;
    }
    const ysrc = cy + (ya - cy - P.dy)/P.sy;
    if(ysrc < -1 || ysrc > h) continue;
    const row = Y*w*4;
    for(let X=0;X<w;X++){
      const xa = F ? (ca + (X - ca - e)/k) : X;
      const xsrc = cx + (xa - cx - P.dx)/P.sx;
      if(xsrc < -1 || xsrc > w) continue;
      bilinear(src, w, h, xsrc, ysrc, o, row + X*4);
    }
  }
  return out;
}

function bilinear(src, w, h, fx, fy, out, oi){
  const x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0;
  let r=0,g=0,b=0,a=0;
  for(let dy=0;dy<2;dy++){
    const yy=y0+dy; if(yy<0||yy>=h) continue;
    const wy = dy? ty : 1-ty; if(wy<=0) continue;
    for(let dx=0;dx<2;dx++){
      const xx=x0+dx; if(xx<0||xx>=w) continue;
      const wx = dx? tx : 1-tx; if(wx<=0) continue;
      const wgt = wx*wy, i=(yy*w+xx)*4, al=src[i+3]/255;
      r += src[i]  *al*wgt; g += src[i+1]*al*wgt; b += src[i+2]*al*wgt; a += al*wgt;
    }
  }
  if(a<=0.0006) return;
  out[oi]   = clamp(Math.round(r/a),0,255);
  out[oi+1] = clamp(Math.round(g/a),0,255);
  out[oi+2] = clamp(Math.round(b/a),0,255);
  out[oi+3] = clamp(Math.round(a*255),0,255);
}
function buildMaskFromAlpha(imgData,w,h){
  const p=imgData.data, m=new Uint8Array(w*h);
  for(let i=0,j=0;i<m.length;i++,j+=4) m[i]= p[j+3]>=96?1:0;
  return m;
}

/* ---------- estatísticas ---------- */
function updateStats(){
  const n=S.items.length;
  const ok=S.items.filter(i=>i.status==='OK').length;
  $('kN').textContent=n; $('kOK').textContent=ok; $('kRV').textContent=n-ok;
  const rs=S.items.map(i=>i.ev?i.ev.rms:0);
  $('kJ').textContent = (rs.reduce((a,b)=>a+b,0)/n).toFixed(2)+' px';
  $('kW').textContent = Math.max(...rs).toFixed(2)+' px';
}

   VISUALIZAÇÃO

function fitCanvas(){
  const r=cv.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.max(2,Math.round(r.width*dpr)); cv.height=Math.max(2,Math.round(r.height*dpr));
}
window.addEventListener('resize',()=>{fitCanvas();draw();});

function viewport(){
  // enquadramento FIXO — nunca muda entre expressões
  let x=0,y=0,w=S.fw,h=S.fh;
  if($('ckZoom').checked && S.ref){
    const H=S.ref.bot-S.ref.top;
    y=Math.max(0, Math.round(S.ref.top + H*0.34)); h=Math.min(S.fh-y, Math.round(H*0.74));
    let l=1e9,r=-1e9;
    for(let i=S.ref.top;i<S.ref.bot;i++){ if(!isNaN(S.ref.L[i])){ l=Math.min(l,S.ref.L[i]); r=Math.max(r,S.ref.R[i]); } }
    const pad=(r-l)*0.14; x=Math.max(0,Math.round(l-pad)); w=Math.min(S.fw-x,Math.round(r-l+pad*2));
  }
  const sc=Math.min(cv.width/w, cv.height/h);
  return {x,y,w,h,sc, ox:(cv.width-w*sc)/2, oy:(cv.height-h*sc)/2};
}
function paint(imgData, vp, alpha){
  scratch.width=S.fw; scratch.height=S.fh;
  sctx.clearRect(0,0,S.fw,S.fh); sctx.putImageData(imgData,0,0);
  ctx.globalAlpha = alpha===undefined?1:alpha;
  ctx.drawImage(scratch, vp.x,vp.y,vp.w,vp.h, vp.ox,vp.oy, vp.w*vp.sc, vp.h*vp.sc);
  ctx.globalAlpha=1;
}

function draw(){
  if(!cv.width || cv.width<10) fitCanvas();
  ctx.fillStyle='#0f1013'; ctx.fillRect(0,0,cv.width,cv.height);
  if(!S.items.length){ hint('Carregue a pasta com os PNGs.'); return; }
  const it=S.items[S.cur]; if(!it) return;
  const vp=viewport(), v=$('view').value;

  if(v==='orig' || (!it.proc && v==='proc')) paint(it.crop,vp);
  else if(v==='proc') paint(it.proc,vp);
  else if(v==='cmp'){
    const half=Math.round(cv.width/2);
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,half,cv.height); ctx.clip(); paint(it.crop,vp); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(half,0,cv.width-half,cv.height); ctx.clip(); paint(it.proc||it.crop,vp); ctx.restore();
    ctx.strokeStyle='#4d9e7a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(half,0); ctx.lineTo(half,cv.height); ctx.stroke();
    lab('ORIGINAL',12,26); lab('PROCESSADO',half+12,26);
  }
  else if(v==='ovl' || v==='ovlo') drawOverlay(vp, v==='ovlo');
  else if(v==='cnt') drawContours(vp);
  else if(v==='ref'){ paint(it.proc||it.crop,vp); strokeProfile(S.ref,vp,'#ff5d8f',2); lab('rosa = referência de consenso',12,26); }
  else if(v==='dif') drawDiff(vp,it);

  if($('ckDbg').checked) drawDebug(vp,it);
  $('pName').textContent=it.name;
  $('pScore').innerHTML = it.ev ? `${it.status} · <b>${it.ev.rms.toFixed(2)}px</b> rms / ${it.ev.max.toFixed(2)}px máx` : '—';
  $('pIdx').textContent=`${S.cur+1} / ${S.items.length}`;
  if($('ckDbg').checked) $('dbg').textContent = it.ev ?
`dx ${it.P.dx.toFixed(2)}  dy ${it.P.dy.toFixed(2)}
sx ${it.P.sx.toFixed(4)}  sy ${it.P.sy.toFixed(4)}
rms ${it.ev.rms.toFixed(3)}px  max ${it.ev.max.toFixed(3)}px
warp ${it.field ? `k±${(it.field.maxK*100).toFixed(2)}%  ec±${it.field.maxEc.toFixed(2)}px  ey±${it.field.maxEy.toFixed(2)}px` : 'nenhum (só transformação global)'}
score ${it.score.toFixed(3)}` : 'sem dados';
}
function hint(t){ ctx.fillStyle='#4a515b'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText(t,cv.width/2,cv.height/2); ctx.textAlign='left'; }
function lab(t,x,y){ ctx.fillStyle='#9aa4af'; ctx.font='600 12px sans-serif'; ctx.fillText(t,x,y); }

function drawOverlay(vp, useOriginal){
  const key = useOriginal?'ovlO':'ovlP';
  if(S[key]){ paint(S[key],vp); lab(useOriginal?'OVERLAY ORIGINAL — vermelho = divergência':'OVERLAY PROCESSADO — vermelho = divergência restante',12,26); return; }
  const w=S.fw,h=S.fh,n=S.items.length;
  const cnt=new Uint16Array(w*h);
  for(const it of S.items){
    const m = useOriginal ? it.mask : (it.pmask||it.mask);
    for(let i=0;i<cnt.length;i++) if(m[i]) cnt[i]++;
  }
  const img=new ImageData(w,h), d=img.data;
  for(let i=0,j=0;i<cnt.length;i++,j+=4){
    const c=cnt[i]; if(!c) continue;
    const f=c/n;
    if(f>0.985){ d[j]=225;d[j+1]=232;d[j+2]=238;d[j+3]=255; }       // todas concordam
    else { d[j]=255; d[j+1]=Math.round(60+150*f); d[j+2]=Math.round(40+60*f); d[j+3]=Math.round(70+185*(1-Math.abs(f-0.5)*1.4)); }
  }
  S[key]=img;
  paint(img,vp);
  lab(useOriginal?'OVERLAY ORIGINAL — vermelho = divergência':'OVERLAY PROCESSADO — vermelho = divergência restante',12,26);
}
function drawContours(vp){
  ctx.save(); ctx.lineWidth=1;
  for(let i=0;i<S.items.length;i++){
    const it=S.items[i];
    if(it.proc && !it.cProf) it.cProf = rowProfile(it.pmask, S.fw, S.fh);
    const ap = it.cProf || it.prof;
    ctx.strokeStyle = i===S.cur ? '#4dd39c' : 'rgba(255,255,255,0.13)';
    strokeProfile(ap,vp, ctx.strokeStyle, i===S.cur?2:1);
  }
  if(S.ref) strokeProfile(S.ref,vp,'#ff5d8f',2);
  ctx.restore(); lab('contornos de todas · rosa = referência',12,26);
}
function profFromMask(m){ return rowProfile(m,S.fw,S.fh); }
function strokeProfile(p,vp,color,lw){
  if(!p) return;
  ctx.strokeStyle=color; ctx.lineWidth=lw||1;
  for(const side of ['L','R']){
    ctx.beginPath(); let started=false;
    for(let y=p.top;y<p.bot;y++){
      if(isNaN(p[side][y])) { started=false; continue; }
      const X=vp.ox+(p[side][y]-vp.x)*vp.sc, Y=vp.oy+(y-vp.y)*vp.sc;
      if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
    }
    ctx.stroke();
  }
}
function drawDiff(vp,it){
  const w=S.fw,h=S.fh;
  const a=it.pmask||it.mask;
  const ref=S.refMaskCache || (S.refMaskCache = refMask());
  const img=new ImageData(w,h), d=img.data;
  for(let i=0,j=0;i<a.length;i++,j+=4){
    const x=a[i], y=ref[i];
    if(x&&y){ d[j]=40;d[j+1]=46;d[j+2]=54;d[j+3]=255; }
    else if(x){ d[j]=255;d[j+1]=70;d[j+2]=90;d[j+3]=255; }
    else if(y){ d[j]=70;d[j+1]=150;d[j+2]=255;d[j+3]=255; }
  }
  paint(img,vp); lab('vermelho = sobra · azul = falta · cinza = coincide',12,26);
}
function refMask(){
  const w=S.fw,h=S.fh,m=new Uint8Array(w*h);
  if(!S.ref) return m;
  for(let y=S.ref.top;y<S.ref.bot;y++){
    if(isNaN(S.ref.L[y])) continue;
    const l=Math.round(S.ref.L[y]), r=Math.round(S.ref.R[y]);
    for(let x=Math.max(0,l);x<Math.min(w,r);x++) m[y*w+x]=1;
  }
  return m;
}
function drawDebug(vp,it){
  if(!S.ref) return;
  const H=S.ref.bot-S.ref.top;
  ctx.strokeStyle='rgba(120,200,255,.5)'; ctx.setLineDash([5,5]); ctx.lineWidth=1;
  for(const t of [0.5,0.75,0.9]){
    const Y=vp.oy+(S.ref.top+H*t-vp.y)*vp.sc;
    ctx.beginPath(); ctx.moveTo(0,Y); ctx.lineTo(cv.width,Y); ctx.stroke();
    ctx.fillStyle='rgba(120,200,255,.8)'; ctx.font='10px monospace'; ctx.fillText((t*100)+'%',4,Y-3);
  }
  ctx.setLineDash([]);
  if(it.field){
    ctx.strokeStyle='#ffb020'; ctx.beginPath();
    for(let y=S.ref.top;y<S.ref.bot;y++){
      const X=vp.ox+20+it.field.ec[y]*8, Y=vp.oy+(y-vp.y)*vp.sc;
      y===S.ref.top?ctx.moveTo(X,Y):ctx.lineTo(X,Y);
    }
    ctx.stroke(); ctx.fillStyle='#ffb020'; ctx.font='10px monospace'; ctx.fillText('campo ec(y) ×8',4,vp.oy+14);
  }
}

/* ---------- thumbnails ---------- */
function buildThumbs(){
  const box=$('thumbs'); box.innerHTML='';
  S.items.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='th'+(i===S.cur?' sel':'');
    const c=document.createElement('canvas'); c.width=66; c.height=88;
    const g=c.getContext('2d');
    scratch.width=S.fw; scratch.height=S.fh;
    sctx.clearRect(0,0,S.fw,S.fh); sctx.putImageData(it.proc||it.crop,0,0);
    let sx=0,sy=0,sw=S.fw,sh=S.fh;
    if(S.ref){ const H=S.ref.bot-S.ref.top; sy=Math.max(0,Math.round(S.ref.top+H*0.28)); sh=Math.min(S.fh-sy,Math.round(H*0.8)); }
    g.fillStyle='#15161a'; g.fillRect(0,0,66,88);
    g.drawImage(scratch,sx,sy,sw,sh,0,0,66,88);
    d.appendChild(c);
    if(it.status!=='—'){
      const b=document.createElement('span'); b.className='bg '+(it.status==='OK'?'ok':'rv'); b.textContent=it.status; d.appendChild(b);
      const s=document.createElement('span'); s.className='sc'; s.textContent=it.ev.rms.toFixed(2); d.appendChild(s);
    }
    d.onclick=()=>{ S.cur=i; buildThumbs(); draw(); };
    d.title=it.name;
    box.appendChild(d);
  });
  const sel=box.children[S.cur]; if(sel) sel.scrollIntoView({block:'nearest'});
}

/* ---------- player ---------- */
$('btnPrev').onclick=()=>{ step(-1); };
$('btnNext').onclick=()=>{ step(1); };
$('btnPlay').onclick=()=>{ S.playing?stopPlay():startPlay(); };
$('fps').oninput=()=>{ $('fpsv').textContent=$('fps').value; if(S.playing){stopPlay();startPlay();} };
function step(d){ if(!S.items.length) return; S.cur=(S.cur+d+S.items.length)%S.items.length; buildThumbs(); draw(); }
function startPlay(){ if(!S.items.length) return; S.playing=true; $('btnPlay').textContent='❚❚ Pause';
  S.timer=setInterval(()=>{ S.cur=(S.cur+1)%S.items.length; draw(); }, 1000/parseInt($('fps').value,10)); }
function stopPlay(){ S.playing=false; $('btnPlay').textContent='▶ Play'; if(S.timer) clearInterval(S.timer); S.timer=null; buildThumbs(); }

/* ============================================================
   EXPORTAÇÃO
   ============================================================ */
async function makePNG(it){
  const c=document.createElement('canvas'); c.width=S.W; c.height=S.H;
  const g=c.getContext('2d');
  scratch.width=S.fw; scratch.height=S.fh;
  sctx.clearRect(0,0,S.fw,S.fh); sctx.putImageData(it.proc,0,0);
  g.drawImage(scratch, S.fx, S.fy);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}
$('btnZip').onclick=async()=>{
  $('btnZip').disabled=true; stopPlay();
  const files=[];
  for(let i=0;i<S.items.length;i++){
    setProg(i/S.items.length,`Exportando ${i+1}/${S.items.length}`);
    if(i%3===0) await yieldUI();
    files.push({name:S.items[i].name, data:await makePNG(S.items[i])});
  }
  const blob=zipStore(files);
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='head_lock_alinhadas.zip'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
  setProg(1,'ZIP gerado.'); $('btnZip').disabled=false;
};
$('btnDir').onclick=async()=>{
  if(!window.showDirectoryPicker) return;
  let dir; try{ dir=await window.showDirectoryPicker({mode:'readwrite'}); }catch(e){ return; }
  $('btnDir').disabled=true; stopPlay();
  for(let i=0;i<S.items.length;i++){
    setProg(i/S.items.length,`Salvando ${i+1}/${S.items.length}`);
    if(i%3===0) await yieldUI();
    const data=await makePNG(S.items[i]);
    const fh=await dir.getFileHandle(S.items[i].name,{create:true});
    const ws=await fh.createWritable(); await ws.write(data); await ws.close();
  }
  setProg(1,'Salvo na pasta.'); $('btnDir').disabled=false;
};

/* ZIP (store, sem compressão — PNG já é comprimido) */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[];
  let off=0;
  const now=new Date();
  const dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
  const dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  for(const f of files){
    const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new Uint8Array(30+nm.length), v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0,true); v.setUint16(8,0,true);
    v.setUint16(10,dt,true); v.setUint16(12,dd,true); v.setUint32(14,crc,true);
    v.setUint32(18,sz,true); v.setUint32(22,sz,true); v.setUint16(26,nm.length,true); v.setUint16(28,0,true);
    lh.set(nm,30);
    parts.push(lh,f.data);
    const ch=new Uint8Array(46+nm.length), cvw=new DataView(ch.buffer);
    cvw.setUint32(0,0x02014b50,true); cvw.setUint16(4,20,true); cvw.setUint16(6,20,true);
    cvw.setUint16(8,0,true); cvw.setUint16(10,0,true); cvw.setUint16(12,dt,true); cvw.setUint16(14,dd,true);
    cvw.setUint32(16,crc,true); cvw.setUint32(20,sz,true); cvw.setUint32(24,sz,true);
    cvw.setUint16(28,nm.length,true); cvw.setUint32(42,off,true);
    ch.set(nm,46); central.push(ch);
    off += lh.length + sz;
  }
  let cs=0; for(const c of central) cs+=c.length;
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cs,true); ev.setUint32(16,off,true);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}

/* ---------- init ---------- */
window.addEventListener('load',()=>{ fitCanvas(); draw(); });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowLeft'){step(-1);e.preventDefault();}
  if(e.key==='ArrowRight'){step(1);e.preventDefault();}
  if(e.code==='Space'){ S.playing?stopPlay():startPlay(); e.preventDefault(); }
});
