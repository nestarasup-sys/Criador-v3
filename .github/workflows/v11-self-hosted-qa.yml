name: V11 Self Hosted QA
# Final V11 head validation: Fabricador V2 rebuild

on:
  push:
    branches: [V11-TESTE]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-self-hosted-qa
  cancel-in-progress: true

jobs:
  quality:
    name: V11 Windows quality gates
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout V11-TESTE
        shell: pwsh
        run: |
          git fetch origin V11-TESTE --prune
          git checkout -B V11-TESTE origin/V11-TESTE
          git reset --hard origin/V11-TESTE
          git clean -fd -e dados-locais-premium -e public/models/modelos
          Write-Host "Branch: $(git branch --show-current)"
          Write-Host "HEAD: $(git rev-parse HEAD)"
          if ((git branch --show-current) -ne "V11-TESTE") { throw "Runner não está na branch V11-TESTE." }
          if ((git rev-parse HEAD) -ne (git rev-parse origin/V11-TESTE)) { throw "HEAD local não corresponde a origin/V11-TESTE." }

      - name: Protect local working data
        shell: pwsh
        run: |
          $trackedLocalData = git ls-files -- "dados-locais-premium"
          if ($trackedLocalData) { throw "dados-locais-premium entrou no Git." }

          $trackedModelFiles = @(git ls-files -- "public/models/modelos" | Where-Object { $_ -ne "public/models/modelos/README.md" })
          if ($trackedModelFiles.Count -gt 0) {
            throw "Assets locais de modelos entraram no Git: $($trackedModelFiles -join ', ')"
          }

      - name: Environment
        shell: pwsh
        run: |
          node --version
          npm --version
          where.exe node
          where.exe npm

      - name: Install dependencies
        run: npm ci

      - name: Fabricador focused tests
        run: node --test tests/model-export-session.test.mjs tests/ferramentas-layout.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Fabricador E2E smoke
        run: npm run test:e2e:fabricador

      - name: Final repository status
        if: always()
        shell: pwsh
        run: |
          git status --short
          Write-Host "QA finalizado no runner local. Nenhum artifact é enviado."
