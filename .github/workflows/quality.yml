name: Quality

on:
  push:
    branches:
      - V12
      - autonomous-overhaul
  pull_request:
    branches:
      - V12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene
        run: npm run check:repo

      - name: Architecture budgets
        run: npm run check:arch

      - name: JavaScript syntax
        run: npm run check:syntax

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit and contract tests
        run: npm run test:unit

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  windows-smoke:
    name: Windows clean-clone smoke
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout clean workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Bootstrap fresh clone
        run: node scripts/local-bootstrap.mjs

      - name: Verify bootstrap state
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules)) { throw "Bootstrap não criou node_modules." }
          node scripts/local-bootstrap.mjs --check

      - name: Repository hygiene
        run: npm run check:repo

      - name: Focused desktop smoke
        run: node --test tests/bat-smoke.test.mjs tests/local-security.test.mjs tests/storage-atomic.test.mjs tests/character-persistence.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Fabricador E2E smoke
        run: npm run test:e2e:fabricador
